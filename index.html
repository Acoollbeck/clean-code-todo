<html>
  <head>
    <title>Todo App</title>
    <link href="https://fonts.googleapis.com/css?family=Lato:300,400,700" rel="stylesheet" type="text/css" />
    <link rel="stylesheet" href="style.css" type="text/css" media="screen" charset="utf-8" />
  </head>
  <body>
    <div class="aaa">
      <img src="./eisenhower-matrix.jpg" /><a
        class="more_inf"
        href="https://goal-life.com/page/method/matrix-eisenhower"
        >Want more details&quest;</a
      >
    </div>
    <div class="centered-main-page-element">
      <div id="topSectionForAddingElementToList">
        <label for="new-task">Add Item</label>
        <div class="task-row-wrapper"><input id="new-task" class="task" type="text" /><button>Add</button></div>
      </div>
      <h3>Todo</h3>
      <ul id="incompleteTasks"></ul>
      <h3>Completed</h3>
      <ul id="completed-tasks"></ul>
    </div>
    <script type="text/javascript" src="app.js"></script>
  </body>
</html>
